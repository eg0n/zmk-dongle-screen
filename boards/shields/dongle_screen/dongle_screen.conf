CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Idle blanking: use ZMK's activity-based backlight auto-off
# instead of a custom thread. Timeout is set in your zmk-config
# via CONFIG_ZMK_IDLE_TIMEOUT (miryoku_zmk already sets 300000 ms).
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Sample the ALS more often than the 2000 ms default so brightness
# tracks room lighting changes without a visible lag.
CONFIG_ZMK_AMBIENT_LIGHT_POLL_INTERVAL_MS=500
